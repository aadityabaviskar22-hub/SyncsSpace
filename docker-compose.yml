version: '3.8'

services:
  # ==========================================
  # 1. MongoDB Database Engine
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: hub_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: project_hub
    volumes:
      - mongo_data:/data/db
    networks:
      - hub_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Node.js + Express API & Socket.IO Server
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hub_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/project_hub
      JWT_SECRET: super_secure_jwt_access_key_for_awp_capstone_2026!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super_secure_jwt_refresh_key_for_awp_capstone_2026!
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:4200
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hub_net

  # ==========================================
  # 3. React SPA Client (Members & Managers)
  # ==========================================
  react-client:
    build:
      context: ./react-client
      dockerfile: Dockerfile
    container_name: hub_react_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hub_net

  # ==========================================
  # 4. Angular SPA Admin Portal (Admins)
  # ==========================================
  angular-admin:
    build:
      context: ./angular-admin
      dockerfile: Dockerfile
    container_name: hub_angular_admin
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - hub_net

# ==========================================
# Named Volumes for Persistent Storage
# ==========================================
volumes:
  mongo_data:
    name: hub_mongo_data
  uploads_data:
    name: hub_uploads_data

# ==========================================
# Isolated Bridge Network
# ==========================================
networks:
  hub_net:
    name: hub_network
    driver: bridge
